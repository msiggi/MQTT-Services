trigger:
- nugetrelease

pool:
  vmImage: windows-latest

variables:
#  project:  '**/MqttServices.Core.csproj'
  solution: '**/*.slnx'
  buildPlatform: 'Any CPU'
  buildConfiguration: 'Release'

steps:
- task: UseDotNet@2
  displayName: 'Use .NET Core 10 sdk'
  inputs:
    packageType: 'sdk'
    version: '10.0.x'
    includePreviewVersions: false

- task: DotNetCoreCLI@2
  displayName: 'dotnet restore'
  inputs:
    command: restore
    projects: |
      **/*.csproj
      !**/*WorkerService*.csproj

- task: DotNetCoreCLI@2
  displayName: Build
  inputs:
    command: build 
    projects: |
      **/*.csproj
      !**/*WorkerService*.csproj
    # ContinuousIntegrationBuild makes the build deterministic and normalises the source paths
    # SourceLink embeds. It has to be set here, because pack runs with nobuild.
    arguments: '--configuration $(BuildConfiguration) -p:ContinuousIntegrationBuild=true'

- task: DotNetCoreCLI@2
  displayName: Pack
  inputs:
    command: 'pack'
    packagesToPack: '**/MqttServices.Core.csproj'
    nobuild: true
    # Produces the .snupkg next to the .nupkg; nuget push picks it up automatically.
    includesymbols: true
    outputDir: '$(Build.ArtifactStagingDirectory)'
            
- task: NuGetCommand@2
  displayName: "nuget push nuget.org"
  inputs:
    command: 'push'
    packagesToPush: '$(Build.ArtifactStagingDirectory)/**/*.nupkg;!$(Build.ArtifactStagingDirectory)/**/*.symbols.nupkg'
    nuGetFeedType: 'external'
    publishFeedCredentials: 'Nuget.org'

